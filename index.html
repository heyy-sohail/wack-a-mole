<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Sohail Azain">
    <title>Whack-a-Mole</title>
    <!-- Logo -->
    <link rel="icon" type="image/png" href="Mole.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> Whack A Mole </h1>

    <div class="top-bar">
        <div class="stat">Score: <span id="score">0</span></div>
        <div class="stat">Time: <span id="time">30</span></div>
        
        <div class="controls">
            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
            </select>
            <button id="startBtn">START GAME</button>
        </div>
    </div>

    <div class="grid" id="grid"></div>

    <!-- Game Over -->
    <div class="game-over" id="gameOver">
        <h2>GAME OVER!</h2>
        <h3>Your Score: <span id="finalScore">0</span></h3>
        <p>Best Score: <span id="highScoreDisplay">0</span></p>
        <button id="restartBtn">Play Again</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
